name: Release

# A pushed v* tag builds, verifies and publishes a GitHub Release.
# A manual dispatch (dry_run defaults to true) and any PR touching the release
# inputs run the same build as a dry run: everything is uploaded as workflow
# artifacts and no release is created. See RELEASING.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build everything but do not create a release. A real release must be dispatched from a v* tag.
        type: boolean
        default: true
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/workflows/**
      - editors/vscode/**
      - cmd/**
      - LICENSE

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  meta:
    name: Resolve version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      dry_run: ${{ steps.v.outputs.dry_run }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        name: Resolve version and release mode
        env:
          EVENT: ${{ github.event_name }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ext_version="$(jq -r .version editors/vscode/package.json)"

          dry_run=true
          if [ "$EVENT" = push ] && [ "$REF_TYPE" = tag ]; then
            dry_run=false
          elif [ "$EVENT" = workflow_dispatch ] && [ "$INPUT_DRY_RUN" = false ]; then
            if [ "$REF_TYPE" != tag ]; then
              echo "::error::A real release must be dispatched from a v* tag (choose the tag under 'Use workflow from'), not from $REF_NAME."
              exit 1
            fi
            dry_run=false
          fi

          tag=""
          if [ "$REF_TYPE" = tag ]; then
            tag="$REF_NAME"
            version="${tag#v}"
            if ! grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' <<<"$version"; then
              echo "::error::Tag $tag is not v<major>.<minor>.<patch>[-<prerelease>]."
              exit 1
            fi
            if [ "$version" != "$ext_version" ]; then
              echo "::error::editors/vscode/package.json has version $ext_version but the tag is $tag. Bump the extension version to $version and re-tag (see RELEASING.md)."
              exit 1
            fi
          else
            version="0.0.0-dev+$(git rev-parse --short HEAD)"
          fi

          prerelease=false
          case "$version" in *-*) prerelease=true ;; esac

          {
            echo "version=$version"
            echo "tag=$tag"
            echo "dry_run=$dry_run"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "### Release: version \`$version\`, dry run: $dry_run, prerelease: $prerelease" >> "$GITHUB_STEP_SUMMARY"

  verify:
    name: Verify
    # The full container matrix gates a real or dispatched release; a PR dry
    # run only gets the fast checks.
    uses: ./.github/workflows/ci.yml
    with:
      full: ${{ github.event_name != 'pull_request' }}
    permissions:
      contents: read

  binaries:
    name: Binaries
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - name: Cross-compile and package
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p build dist lsp
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            ext=""
            if [ "$os" = windows ]; then ext=".exe"; fi
            for tool in tlang tlang-lsp; do
              name="${tool}_${VERSION}_${os}_${arch}"
              stage="build/$name"
              mkdir -p "$stage"
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
                -ldflags "-s -w -X main.version=${VERSION}" \
                -o "$stage/$tool$ext" "./cmd/$tool"
              chmod 755 "$stage/$tool$ext"
              cp LICENSE "$stage/LICENSE"
              cp runtime/LICENSE "$stage/LICENSE.runtime"
              cp README.md "$stage/README.md"
              if [ "$os" = windows ]; then
                (cd build && zip -q -r "../dist/$name.zip" "$name")
              else
                tar -C build --owner=0 --group=0 -czf "dist/$name.tar.gz" "$name"
              fi
            done
            mkdir -p "lsp/${os}_${arch}"
            cp "build/tlang-lsp_${VERSION}_${os}_${arch}/tlang-lsp$ext" "lsp/${os}_${arch}/"
          done
          ls -l dist
      - name: Check the stamped version
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          got="$("build/tlang_${VERSION}_linux_amd64/tlang" version)"
          echo "$got"
          [ "$got" = "tlang $VERSION" ]
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-binaries
          path: dist/*
          if-no-files-found: error
          retention-days: 14
      # Raw tlang-lsp builds for the extension job. Artifacts drop the exec bit;
      # the extension job restores it before packaging.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lsp-builds
          path: lsp/
          if-no-files-found: error
          retention-days: 1

  extension:
    name: Extension packages
    needs: [meta, binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lsp-builds
          path: lsp
      - name: npm ci and compile
        working-directory: editors/vscode
        run: |
          npm ci
          npm run compile
      - name: Package one .vsix per target
        working-directory: editors/vscode
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p ../../dist
          for pair in win32-x64:windows_amd64 win32-arm64:windows_arm64 \
                      linux-x64:linux_amd64 linux-arm64:linux_arm64 \
                      darwin-x64:darwin_amd64 darwin-arm64:darwin_arm64; do
            target="${pair%%:*}"
            goplat="${pair#*:}"
            exe="tlang-lsp"
            case "$target" in win32-*) exe="tlang-lsp.exe" ;; esac
            rm -rf bin
            mkdir bin
            cp "../../lsp/$goplat/$exe" "bin/$exe"
            chmod 755 "bin/$exe"
            out="../../dist/tlang-${VERSION}-${target}.vsix"
            npx --no-install vsce package --target "$target" -o "$out"
            listing="$(zipinfo "$out")"
            # Here-strings, not `printf | grep -q`: grep -q exits on the first
            # match, printf then dies of SIGPIPE, and pipefail turns a found
            # entry into a failure.
            if ! grep -q " extension/bin/$exe\$" <<<"$listing"; then
              echo "::error::$out does not contain extension/bin/$exe"
              exit 1
            fi
            if [ "$exe" = tlang-lsp ] && ! grep -Eq "^-rwx.* extension/bin/tlang-lsp\$" <<<"$listing"; then
              echo "::error::$out lost the exec bit on extension/bin/tlang-lsp"
              printf '%s\n' "$listing" | grep 'extension/bin/'
              exit 1
            fi
          done
          rm -rf bin
          ls -l ../../dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-vsix
          path: dist/*.vsix
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: [meta, verify, binaries, extension]
    if: needs.meta.outputs.dry_run == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Write SHA256SUMS
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
          VERSION: ${{ needs.meta.outputs.version }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
        run: |
          set -euo pipefail
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "TLang $VERSION" \
            --generate-notes \
            "${flags[@]}"
